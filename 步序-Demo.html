<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7fb">
  <meta name="description" content="步序是整理目标、思考和收支的个人工作台。">
  <title>步序 · 个人工作台</title>
  <style>
:root {
  color-scheme: light;
  --ink: #20243a;
  --muted: #62677f;
  --soft: #f3f3fa;
  --border: #e8e8f2;
  --paper: #fff;
  --base: #f7f7fb;
  --primary: #5539c9;
  --primary-fill: #5539c9;
  --primary-hover: #4630ae;
  --primary-soft: #eeebfc;
  --primary-tint: #e4defa;
  --positive: #147856;
  --positive-soft: #e5f5ed;
  --negative: #b14c53;
  --negative-soft: #fcf0f0;
  --inset: #fbfbfe;
  --savings-bg: #f6f4fd;
  --control-border: #dcdcea;
  --sidebar-width: 224px;
  --panel-width: 350px;
  --radius: 17px;
  font-family: "DM Sans", "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--base);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #eeebf7;
  --muted: #b8b0ca;
  --soft: #2b263d;
  --border: #353047;
  --paper: #201c2f;
  --base: #171522;
  --primary: #c2b1ff;
  --primary-fill: #6747d1;
  --primary-hover: #7255d6;
  --primary-soft: #332754;
  --primary-tint: #433366;
  --positive: #84d9b3;
  --positive-soft: #233e37;
  --negative: #ffacb0;
  --negative-soft: #492a35;
  --inset: #272237;
  --savings-bg: #2b2340;
  --control-border: #504763;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .55; }
a { color: inherit; text-decoration: none; }
svg { flex: none; vertical-align: middle; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--muted); }

.shell { display: flex; min-height: 100dvh; align-items: flex-start; }
.sidebar {
  position: sticky; top: 0; width: var(--sidebar-width); flex: 0 0 var(--sidebar-width);
  height: 100dvh; background: var(--paper); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 32px 18px 16px;
}
.brand-area { padding: 0 14px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 800; letter-spacing: .08em; }
.brand-mark {
  width: 37px; height: 37px; display: flex; align-items: flex-end; justify-content: center; gap: 2px;
  padding-bottom: 10px; border-radius: 11px; background: var(--primary-fill); box-shadow: 0 4px 10px #5539c933;
}
.brand-mark i { width: 4px; height: 7px; background: #fff; border-radius: 2px; }
.brand-mark i:nth-child(2) { height: 11px; }
.brand-mark i:nth-child(3) { height: 16px; }
.brand-area p { margin-top: 12px; color: var(--muted); font-size: 12px; letter-spacing: .08em; }
.sidebar nav { display: grid; gap: 6px; margin-top: 34px; }
.nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 13px; min-height: 46px; border-radius: 10px; color: var(--muted); font-weight: 650; }
.nav-link:hover { background: var(--base); color: var(--ink); }
.nav-link.selected { background: var(--primary-soft); color: var(--primary); }
.sidebar-foot { margin-top: auto; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 16px 8px 3px; }
.avatar { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 750; }
.sidebar-foot strong, .sidebar-foot small { display: block; }
.sidebar-foot strong { font-size: 13px; }
.sidebar-foot small { color: var(--muted); margin-top: 3px; font-size: 11px; }

.workspace { flex: 1 1 0; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 5; min-height: 66px; padding: 0 clamp(20px, 3vw, 46px);
  display: flex; align-items: center; justify-content: space-between; background: var(--paper);
  border-bottom: 1px solid var(--border);
}
.breadcrumbs { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
.breadcrumbs strong { color: var(--ink); }
.topbar-tools { display: flex; align-items: center; gap: 11px; margin-inline-start: auto; white-space: nowrap; }
.clock-indicator, .weather-indicator { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.weather-indicator { min-height: 36px; padding: 0 6px; border-radius: 7px; border: 0; background: transparent; }
.weather-indicator:hover { background: var(--soft); color: var(--ink); }
.topbar .ai-toggle { width: 38px; min-height: 38px; padding: 0; }
.mobile-brand, .mobile-menu { display: none; }
#main { max-width: 1460px; margin-inline: auto; padding: 30px clamp(20px, 3vw, 46px) 40px; outline: none; container-type: inline-size; }
h1 { font-size: clamp(28px, 2.7vw, 38px); line-height: 1.22; letter-spacing: -.045em; font-weight: 800; overflow-wrap: anywhere; }
h2 { font-size: 17px; font-weight: 750; }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex-shrink: 0;
  min-height: 39px; padding: 8px 13px; border-radius: 9px; border: 1px solid transparent;
  background: transparent; color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap;
  transition: background-color .15s, color .15s, border-color .15s;
}
.secondary { border-color: var(--border); background: var(--paper); }
.secondary:hover, .icon-button:hover { background: var(--soft); }
.primary { background: var(--primary-fill); color: white; border-color: var(--primary-fill); }
.primary:hover { background: var(--primary-hover); }
.quiet, .ai-toggle { color: var(--primary); background: var(--primary-soft); }
.quiet:hover, .ai-toggle:hover, .ai-toggle.active { background: var(--primary-tint); }
.icon-button { min-height: 36px; width: 36px; padding: 0; color: var(--muted); }
.icon-button[data-action^="delete"]:hover { color: var(--negative); background: var(--negative-soft); }
.danger { background: #ab363e; color: white; }
.danger:hover { background: #902d36; }
.text-link, .back-link { color: var(--primary); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; min-height: 34px; white-space: nowrap; }
.text-link:hover, .back-link:hover { text-decoration: underline; }

.hero {
  position: relative; isolation: isolate; overflow: hidden;
  border-radius: 20px; margin-bottom: 20px;
  background: radial-gradient(ellipse at 92% 4%, #734dd9 0%, transparent 55%), linear-gradient(104deg, #2f226b 0%, #452b9f 61%, #6339c4 100%);
  color: white; box-shadow: 0 7px 18px #3f278122;
}
.hero-body { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; min-height: 176px; padding: 24px 30px; }
.hero-body:focus-visible { outline: 2px solid #fff; outline-offset: -5px; border-radius: inherit; }
.hero h1 { font-size: clamp(21px, 2.15vw, 32px); line-height: 1.3; letter-spacing: -.035em; }
.hero h1, .hero p { max-width: min(65%, 670px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-body:hover h1 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
.hero p { color: #ebe4ff; margin-top: 8px; font-size: 13px; line-height: 1.6; }
.hero-art { position: absolute; width: 390px; height: 240px; right: 1.8%; top: 50%; transform: translateY(-50%) scale(.82); transform-origin: right center; pointer-events: none; }
.orbit { border: 1px solid #d6c6ff55; width: 348px; height: 131px; border-radius: 50%; position: absolute; top: 59px; left: 17px; transform: rotate(-25deg); }
.orbit-b { width: 300px; height: 108px; top: 70px; left: 44px; transform: rotate(-25deg); opacity: .62; }
.art-grid {
  position: absolute; width: 230px; height: 135px; left: 67px; top: 84px; transform: rotate(-21deg) skew(27deg);
  background-image: linear-gradient(#d6c6ff44 1px, transparent 1px), linear-gradient(90deg, #d6c6ff44 1px, transparent 1px);
  background-size: 21px 21px; mask-image: radial-gradient(ellipse, #000 15%, transparent 73%);
}
.art-light { position: absolute; width: 244px; height: 110px; right: 45px; bottom: 18px; background: radial-gradient(ellipse, #bc98fa62, transparent 70%); }
.stair {
  --step-color: #b091f4; position: absolute; width: 75px; height: 65px; background: linear-gradient(115deg, var(--step-color), #8151e2);
  transform: skewY(-16deg); border-radius: 4px 0 3px 5px; box-shadow: -7px 9px 19px #28135750;
}
.stair::before { content: ""; position: absolute; height: 26px; bottom: 100%; left: 0; width: 100%; transform: skewX(46deg); transform-origin: bottom; background: linear-gradient(110deg, #e3d3ff, #b18bef); border-radius: 5px 5px 0 0; }
.stair::after { content: ""; position: absolute; inset: 0 auto 0 100%; width: 27px; transform: skewY(44deg); transform-origin: left; background: linear-gradient(135deg, #9566ea, #5e31b7); border-radius: 0 5px 5px 0; }
.stair-one { left: 105px; top: 148px; height: 38px; z-index: 3; --step-color: #aa8be6; }
.stair-two { left: 166px; top: 108px; height: 67px; z-index: 2; --step-color: #bb9af8; }
.stair-three { left: 228px; top: 66px; height: 97px; z-index: 1; --step-color: #c9aafa; }
.art-check {
  z-index: 4; display: grid; place-items: center; width: 49px; height: 49px; position: absolute; left: 248px; top: 35px;
  border: 1px solid #d9fff1; background: #cbf5df; color: #286c5a; border-radius: 15px; transform: rotate(-10deg);
  box-shadow: 3px 6px 0 #8ed5b5, 0 5px 20px #441f8880;
}
.art-spark { color: #f0dfff; position: absolute; }
.spark-one { left: 129px; top: 46px; font-size: 25px; }
.spark-two { right: 26px; top: 95px; font-size: 16px; }
.art-dot { width: 7px; height: 7px; border-radius: 50%; background: #d9b9ff; position: absolute; left: 63px; top: 148px; }

.dashboard-grid { display: grid; grid-template-columns: 1.08fr 1fr; gap: 18px; }
.card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; min-width: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-head h2 { display: flex; align-items: center; gap: 9px; }
.section-icon, .goal-icon, .transaction-icon {
  display: grid; place-items: center; flex: none; border-radius: 10px; width: 35px; height: 35px;
  color: var(--primary); background: var(--primary-soft);
}
.section-actions { display: flex; gap: 12px; align-items: center; }
.violet { --tone: #6343d4; --tone-soft: #f0ecff; }
.mint { --tone: #147c66; --tone-soft: #e6f6ef; }
.amber { --tone: #9a5b17; --tone-soft: #fff2dc; }
[data-theme="dark"] .violet { --tone: #c2b1ff; --tone-soft: #332754; }
[data-theme="dark"] .mint { --tone: #85d9bc; --tone-soft: #233e37; }
[data-theme="dark"] .amber { --tone: #f6be82; --tone-soft: #462f25; }
.goal-icon { color: var(--tone); background: var(--tone-soft); width: 40px; height: 40px; }
.goal-rows { display: grid; }
.goal-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.goal-row + .goal-row { border-top: 1px solid var(--border); }
.goal-row:hover .goal-row-label strong { color: var(--primary); }
.goal-row > svg { color: #888ba3; }
.goal-row-body { flex: 1; min-width: 0; }
.goal-row-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.goal-row-label strong { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.goal-row-label b { color: var(--tone); font-size: 13px; }
small { color: var(--muted); }
.goal-row small { display: block; margin-top: 5px; font-size: 11px; }
progress { display: block; width: 100%; height: 6px; appearance: none; border: none; border-radius: 20px; background: var(--tone-soft, var(--primary-soft)); overflow: hidden; color: var(--tone, var(--primary)); }
progress::-webkit-progress-bar { background: transparent; }
progress::-webkit-progress-value { background: var(--tone, var(--primary)); border-radius: 20px; }
progress::-moz-progress-bar { background: var(--tone, var(--primary)); border-radius: 20px; }
.finance-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 0; }
.stat { border: 1px solid var(--border); border-radius: 10px; background: var(--inset); padding: 12px 10px; min-width: 0; }
.stat span { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.stat strong { display: block; margin-top: 6px; font-size: clamp(14px, 1.4vw, 21px); font-variant-numeric: tabular-nums; letter-spacing: -.045em; overflow-wrap: anywhere; }
.finance-stats.compact .stat { padding: 9px 8px; }
.income { color: var(--positive); }
.expense { color: var(--negative); }
.savings { margin-top: 12px; padding: 10px 12px; border-radius: 11px; background: var(--savings-bg); }
.savings-heading { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.savings-heading > span { color: var(--primary); font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 5px; }
.savings-heading .icon-button { height: 30px; min-height: 30px; width: 30px; }
.savings-amount { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; margin-bottom: 9px; }
.savings-amount strong { font-size: 21px; letter-spacing: -.045em; overflow-wrap: anywhere; }
.savings-amount span { font-size: 12px; color: var(--muted); }
.savings-caption { display: flex; justify-content: space-between; margin-top: 5px; color: var(--muted); font-size: 11px; }
.savings-caption b { color: var(--primary); }
.log-button { margin-top: 10px; width: 100%; }
.notes-card { grid-column: 1 / -1; }
.note-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.note-card { display: flex; flex-direction: column; gap: 7px; min-width: 0; padding: 13px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 11px; transition: border-color .15s, background-color .15s; }
.note-card:hover { border-color: var(--primary); background: var(--soft); }
.note-meta { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 5px; }
.note-meta svg { color: var(--primary); }
.note-card strong { line-height: 1.55; overflow-wrap: anywhere; }
.note-card p { color: var(--muted); font-size: 12px; line-height: 1.65; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 145px; text-align: center; gap: 9px; padding: 12px 0; }
.empty-icon { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; color: var(--primary); background: var(--primary-soft); }
.empty p { color: var(--muted); font-size: 13px; }
.finance-card > .empty { min-height: 82px; }
.finance-card > .empty .empty-icon { display: none; }

.page-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
.page-head p { color: var(--muted); margin-top: 8px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.page-actions, .row-actions { display: flex; gap: 5px; align-items: center; }
.back-link { margin: -5px 0 12px; }
.collection-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(245px, 100%), 1fr)); gap: 16px; }
.collection-tile { display: flex; flex-direction: column; gap: 10px; }
.collection-tile:hover { border-color: #c9bdf2; }
.collection-tile h2 { overflow-wrap: anywhere; }
.collection-tile p { flex: 1; color: var(--muted); line-height: 1.6; overflow-wrap: anywhere; }
.tile-head, .tile-progress, .section-divider { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile-progress { margin-top: 10px; font-size: 12px; color: var(--muted); }
.tile-progress b { color: var(--tone); }
.badge { display: inline-flex; font-size: 12px; font-weight: 700; border-radius: 999px; background: var(--primary-soft); color: var(--primary); padding: 5px 9px; white-space: nowrap; }
.badge.complete { color: var(--positive); background: var(--positive-soft); }
.detail-progress { display: flex; align-items: center; gap: 14px; }
.detail-progress-body { flex: 1; min-width: 0; }
.detail-progress-body > div { display: flex; gap: 5px 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 6px; }
.section-divider { margin: 24px 0 12px; }
.item-list { display: grid; gap: 12px; }
.item-card > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.item-card h3 { font-size: 16px; overflow-wrap: anywhere; }
.item-card header small { display: block; margin-top: 5px; }
.task-list { margin: 10px 0; }
.task-row { display: flex; align-items: center; justify-content: space-between; min-height: 45px; gap: 5px; }
.task-row + .task-row { border-top: 1px solid var(--border); }
.task-row label { flex: 1; display: flex; gap: 10px; align-items: center; cursor: pointer; padding: 7px 0; overflow-wrap: anywhere; }
.task-row input { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
.task-row label.done span { text-decoration: line-through; color: var(--muted); }
.notes-collection .note-card { background: var(--paper); min-height: 133px; padding: 18px; }
.note-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; min-height: 180px; font-size: 15px; }
.finance-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.finance-grid .savings { margin: 0; }
.ledger { margin-top: 16px; }
.month-field input { max-width: 150px; padding: 6px 7px; border: 1px solid var(--border); border-radius: 7px; color: var(--ink); background: var(--paper); }
.transaction-row { display: flex; gap: 10px; align-items: center; min-height: 60px; padding-block: 6px; }
.transaction-row + .transaction-row, .history-row + .history-row { border-top: 1px solid var(--border); }
.transaction-icon.income { color: var(--positive); background: var(--positive-soft); }
.transaction-icon.expense { color: var(--negative); background: var(--negative-soft); }
.transaction-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.transaction-name small, .history-entry small { display: block; margin-top: 4px; }
.transaction-row b { text-align: right; overflow-wrap: anywhere; }
.history-card { padding-block: 7px; }
.history-row { display: flex; align-items: center; gap: 10px; }
.history-entry { border: 0; background: transparent; color: var(--ink); text-align: left; flex: 1; display: flex; gap: 11px; align-items: center; min-height: 68px; padding: 6px 0; }
.history-entry > span:nth-child(2) { flex: 1; overflow-wrap: anywhere; }
.history-entry:hover strong { color: var(--primary); }
.history-entry > svg { color: var(--muted); }

dialog {
  width: min(480px, calc(100% - 24px)); max-height: calc(100dvh - 28px); padding: 0;
  border: 1px solid var(--border); border-radius: var(--radius); color: var(--ink); background: var(--paper); box-shadow: 0 22px 70px #1f173040;
}
dialog::backdrop { background: #20173260; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 19px; border-bottom: 1px solid var(--border); }
.dialog-fields { padding: 18px 20px; display: grid; gap: 13px; }
.field { display: grid; gap: 6px; font-weight: 650; }
.field small { margin-left: 3px; font-weight: 400; }
.field input, .field textarea, .field select {
  padding: 10px 11px; border: 1px solid var(--control-border); border-radius: 8px; min-height: 41px; width: 100%; color: var(--ink); background: var(--paper); font-weight: 400;
}
.field textarea { resize: vertical; }
.type-field { margin: 0; padding: 0; border: none; }
.type-field legend { font-weight: 650; margin-bottom: 7px; }
.type-field > div { display: flex; gap: 8px; }
.type-field label { position: relative; flex: 1; }
.type-field input { position: absolute; opacity: 0; }
.type-field span { display: block; padding: 8px; border-radius: 8px; border: 1px solid var(--border); text-align: center; cursor: pointer; }
.type-field input:checked + span { border-color: #d2c7f8; background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.type-field input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.field-hint { color: var(--muted); font-size: 13px; }
.form-error { color: var(--negative); font-size: 13px; }
.delete-copy { line-height: 1.65; overflow-wrap: anywhere; }
dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.toast { position: fixed; z-index: 30; bottom: 24px; left: 50%; transform: translateX(-50%); border-radius: 10px; padding: 11px 16px; color: white; background: #29223f; box-shadow: 0 5px 18px #28223f33; text-align: center; }

.ai-panel { position: sticky; top: 0; z-index: 8; width: var(--panel-width); flex: 0 0 var(--panel-width); height: 100dvh; background: var(--paper); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.ai-head { min-height: 66px; border-bottom: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
.ai-head > div { flex: 1; min-width: 0; }
.ai-head strong, .ai-head small { display: block; }
.ai-head small { margin-top: 3px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conversation-title { padding: 11px 13px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.message-list { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
.chat-welcome { text-align: center; display: grid; justify-items: center; gap: 10px; padding: min(8vh, 56px) 4px 16px; }

.message { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 12px; }
.message.user { justify-content: flex-end; }
.message-avatar { width: 26px; height: 26px; display: grid; place-items: center; flex: none; color: var(--primary); background: var(--primary-soft); border-radius: 8px; }
.message-content { max-width: calc(100% - 34px); }
.bubble { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--base); border: 1px solid var(--border); border-radius: 4px 11px 11px; padding: 9px 11px; line-height: 1.65; font-size: 13px; }
.user .bubble { background: var(--primary-soft); border-color: var(--border); border-radius: 11px 4px 11px 11px; }
.message-error, .sending { color: var(--muted); font-size: 12px; }
.message-error { color: var(--negative); text-align: right; margin-top: 5px; }
.message-error button { min-height: 29px; }
.composer { padding: 11px 12px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
.composer-field { display: flex; align-items: flex-end; gap: 7px; border: 1px solid var(--control-border); border-radius: 11px; padding: 6px; }
.composer-field:focus-within { border-color: var(--primary); }
.composer-field textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: none; padding: 5px; color: var(--ink); background: transparent; line-height: 1.45; }
.send-button { width: 36px; min-height: 36px; padding: 0; }
.composer > small { display: block; margin-top: 5px; padding-inline: 3px; font-size: 11px; }

.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; max-width: 950px; }
.settings-card .section-head { padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.theme-picker { border: 0; padding: 0; margin: 0; min-width: 0; }
.theme-picker legend { padding: 0; margin-bottom: 8px; font-weight: 650; }
.theme-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.theme-options label { position: relative; cursor: pointer; }
.theme-options input { position: absolute; opacity: 0; }
.theme-options span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 8px 3px; min-height: 68px; border: 1px solid var(--border); border-radius: 9px; color: var(--muted); font-size: 12px; text-align: center; }
.theme-options label:hover span { background: var(--soft); }

  <script>
const STORAGE_KEY = "buxu-prd-demo-v1";

const pad = value => String(value).padStart(2, "0");
const localDate = (date = new Date()) =>
  `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
const currentMonth = () => localDate().slice(0, 7);
const dateLabel = value => new Intl.DateTimeFormat(document.documentElement.lang, {
  month: "long", day: "numeric",
}).format(new Date(value.length === 10 ? value + "T12:00:00" : value));
const activityLabel = value => new Intl.DateTimeFormat(document.documentElement.lang, {
  month: "long", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
}).format(new Date(value));
const money = cents => new Intl.NumberFormat(document.documentElement.lang, {
  style: "currency", currency: "CNY", currencyDisplay: "narrowSymbol", minimumFractionDigits: 2,
}).format(cents / 100);
const updatedFirst = records => [...records].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
const summary = (text, limit = 80) => {
  const compact = text.replace(/\s+/g, " ").trim();
  return compact.length > limit ? compact.slice(0, limit) + "…" : compact;
};

function seedData() {
  const now = new Date();
  const dayInMonth = day => localDate(new Date(now.getFullYear(), now.getMonth(), Math.min(day, now.getDate())));
  const previousMonth = localDate(new Date(now.getFullYear(), now.getMonth() - 1, 10));
  const daysAgo = days => new Date(now.getTime() - days * 86400000).toISOString();
  const makeTasks = (prefix, items) => items.map(([title, done], index) => ({
    id: `${prefix}-${index}`, title, done: Boolean(done),
  }));
  return {
    goals: [
      { id: "english", title: "提升英语口语", description: "能自然地做一个三分钟的英文自我介绍。", tone: "violet", items: [
        { id: "intro", title: "练习自我介绍", tasks: makeTasks("intro", [
          ["写一份草稿", 1], ["整理常用表达", 1], ["录音练习一次", 0],
        ]) },
        { id: "practice", title: "积累日常表达", tasks: makeTasks("practice", [
          ["收集十个常用短语", 1], ["做一次影子跟读", 1], ["找朋友练习对话", 0],
        ]) },
      ] },
      { id: "run", title: "建立跑步习惯", description: "完成每周两次轻松跑，先把节奏稳定下来。", tone: "mint", items: [
        { id: "routine", title: "完成四周跑步计划", tasks: makeTasks("routine", [
          ["第一周 · 两次轻松跑", 1], ["第二周 · 两次轻松跑", 1],
          ["第三周 · 两次轻松跑", 0], ["第四周 · 两次轻松跑", 0],
        ]) },
      ] },
      { id: "read", title: "读完《认知觉醒》", description: "读完并记录三条可以立刻实践的想法。", tone: "amber", items: [
        { id: "reading", title: "读书与笔记", tasks: makeTasks("reading", [
          ["读完上半部分", 1], ["读完全书", 0], ["整理读书笔记", 0],
        ]) },
      ] },
    ],
    notes: [
      { id: "small", title: "把任务拆得再小一点", body: "有些事迟迟没开始，是因为下一步还不够具体。先把「练英语」改成「录一段 60 秒的自我介绍」，看能不能更轻松地开始。", updatedAt: daysAgo(0) },
      { id: "weekend", title: "周末散步时想到的事", body: "试着给日程留一段空白。散步时不听播客，沿着河边走一圈，看看脑子会自己想到什么。", updatedAt: daysAgo(2) },
      { id: "routine-note", title: "", body: "想试试每周五花十分钟复盘，只记三件事：做成了什么、哪里卡住了、下周从哪一步开始。", updatedAt: daysAgo(4) },
    ],
    transactions: [
      { id: "salary", type: "income", cents: 980000, date: dayInMonth(5), note: "本月工资" },
      { id: "freelance", type: "income", cents: 270000, date: dayInMonth(11), note: "设计兼职" },
      { id: "rent", type: "expense", cents: 260000, date: dayInMonth(3), note: "房租" },
      { id: "food", type: "expense", cents: 48250, date: dayInMonth(10), note: "餐饮和买菜" },
      { id: "commute", type: "expense", cents: 20000, date: dayInMonth(9), note: "交通充值" },
      { id: "books", type: "expense", cents: 19800, date: dayInMonth(8), note: "买书" },
      { id: "past-pay", type: "income", cents: 980000, date: previousMonth, note: "上月工资" },
      { id: "past-rent", type: "expense", cents: 260000, date: previousMonth, note: "上月房租" },
    ],
    savings: { current: 3260000, target: 5000000 },
    chats: [
      { id: "speaking", updatedAt: daysAgo(1), messages: [
        { id: "speaking-user", role: "user", text: "怎样把英语口语练习安排得更容易坚持？" },
        { id: "speaking-ai", role: "assistant", text: "先把练习固定在一个已有习惯之后，比如晚饭后。每次用 5 分钟完成一个小任务：读一遍自我介绍、录一遍，再记下一处想改的表达。\n\n今天可以从写出开头三句话开始。" },
      ] },
      { id: "review", updatedAt: daysAgo(5), messages: [
        { id: "review-user", role: "user", text: "帮我想一个十分钟的周复盘流程" },
        { id: "review-ai", role: "assistant", text: "前 3 分钟回顾完成了什么，中间 4 分钟选一件遇到阻碍的事，最后 3 分钟写下下周可以开始的一个动作。" },
      ] },
    ],
  };
}

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (error) {
    console.warn("读取演示数据失败", error);
  }
  return seedData();
}

function progress(tasks) {
  const done = tasks.filter(task => task.done).length;
  const total = tasks.length;
  const percent = total ? Math.round(done / total * 100) : 0;
  return { done, total, percent: done < total ? Math.min(percent, 99) : percent };
}

const goalProgress = goal => progress(goal.items.flatMap(item => item.tasks));
const isComplete = ({ total, done }) => total > 0 && done === total;

function monthlyTotals(transactions, month) {
  const totals = { income: 0, expense: 0, balance: 0, count: 0 };
  for (const transaction of transactions) {
    if (!transaction.date.startsWith(month)) continue;
    totals[transaction.type] += transaction.cents;
    totals.count++;
  }
  totals.balance = totals.income - totals.expense;
  return totals;
}

function weatherCondition(description) {
  if (/thunder/i.test(description)) return ["rain", "雷雨"];
  if (/snow|blizzard|sleet/i.test(description)) return ["snow", "雪"];
  if (/rain|drizzle|shower/i.test(description)) return ["rain", "雨"];
  if (/fog|mist/i.test(description)) return ["cloud", "雾"];
  if (/overcast/i.test(description)) return ["cloud", "阴"];
  if (/cloud/i.test(description)) return ["cloud", "多云"];
  if (/sunny/i.test(description)) return ["sun", "晴"];
  if (/clear/i.test(description)) return ["moon", "晴"];
  return ["cloud", "天气"];
}

function renderWeather() {
  const slot = $("#top-weather");

    slot.innerHTML = `<a class="weather-indicator" href="${weatherSource}" target="_blank" rel="noopener noreferrer" title="${h(label)}" aria-label="${h(label)}">${icon(glyph, 16)}<span>${temperature}°</span></a>`;
    return;
  }
  const label = t({

    denied: "无法定位，请检查浏览器定位权限。", error: "天气暂不可用，点击重试。",
  }[weatherState]);
  slot.innerHTML = `<button class="weather-indicator" type="button" data-action="locate-weather" aria-label="${h(label)}" title="${h(label)}" aria-disabled="${weatherState === "loading"}">${icon(weatherState === "idle" ? "pin" : "cloud", 16)}<span>${weatherState === "denied" || weatherState === "error" ? "—" : t("天气")}</span></button>`;

async function refreshWeather(interactive = false) {
  if (weatherState === "loading") return;
  const keepFocus = $("#top-weather").contains(document.activeElement);
  weatherState = "loading";
  renderWeather();
  if (keepFocus) $("#top-weather button").focus();
  try {
    if (!weatherCoordinates) {
      try {
        weatherCoordinates = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(position => resolve(position.coords), reject, {
            timeout: 8000, maximumAge: 900000,
          });
        });
      } catch {
        weatherState = "denied";
        if (interactive) notify("无法定位，请检查浏览器定位权限。");
        return;
      }
    }
    const { latitude, longitude } = weatherCoordinates;
    const response = await fetch(`${weatherSource}${latitude.toFixed(2)},${longitude.toFixed(2)}?format=j1`, {
      signal: AbortSignal.timeout(8000),
    });
    if (!response.ok) throw new Error();
    const result = await response.json();
    const current = (result.data ?? result).current_condition?.[0];
    const temperature = parseFloat(current?.temp_C);
    const description = current?.weatherDesc?.[0]?.value;
    if (!Number.isFinite(temperature) || typeof description !== "string") throw new Error();
    weatherCurrent = { description, temperature: Math.round(temperature) };
    weatherState = "ready";
  } catch {
    weatherCurrent = null;
    weatherState = "error";
    if (interactive) notify("天气暂不可用，点击重试。");
  } finally {
    const restoreFocus = $("#top-weather").contains(document.activeElement);
    renderWeather();
    if (restoreFocus) $("#top-weather .weather-indicator").focus();
  }
}

function syncProvider(form) {
  const { provider, baseUrl, model, apiKey } = form.elements;
  const enabled = provider.value !== "demo";
  const preset = provider.value === "deepseek" ? deepseek : { baseUrl: "", model: "" };
  form.querySelector(".model-fields").hidden = !enabled;
  baseUrl.readOnly = provider.value === "deepseek";
  baseUrl.value = baseUrl.readOnly ? deepseek.baseUrl : provider.value === settings.provider ? settings.baseUrl : preset.baseUrl;
  model.value = provider.value === settings.provider ? settings.model : preset.model;
  apiKey.value = provider.value === settings.provider ? settings.apiKey : "";
  for (const input of [baseUrl, model, apiKey]) {
    input.disabled = !enabled;
    input.required = enabled;
  }
}

function saveSettings(change) {

function saveModel(form) {
  const fields = new FormData(form);
  const provider = fields.get("provider");
  const error = form.querySelector(".form-error");
  let config = { provider, ...deepseek, apiKey: "" };
  let message = "";
  if (provider !== "demo") {
    const model = fields.get("model").trim();
    const apiKey = fields.get("apiKey").trim();
    try {
      const url = new URL(fields.get("baseUrl"));
      const local = ["localhost", "127.0.0.1", "[::1]"].includes(url.hostname);
      if ((url.protocol !== "https:" && !(local && url.protocol === "http:")) ||
          url.username || url.password || url.search || url.hash) throw new Error();
      config = { provider, model, apiKey, baseUrl: url.href.replace(/\/+$/, "") };
    } catch {
      message = "请输入 HTTPS 接口地址，或本机 HTTP 地址。";
    }
    if (!message && !model) message = "请输入模型名称。";
    if (!message && !/^[\x21-\x7e]+$/.test(apiKey)) message = "请输入有效的 API Key。";
  }
  if (!message && !saveSettings(config)) message = "保存失败，请重试。";
  error.textContent = t(message);
  error.hidden = !message;
  if (!message) {
    syncProvider(form);
    renderAI({ scroll: false });
    notify(t("已保存"));
  }
}

  const caption = active.length ? t("{active} 个目标进行中 · 累计完成 {done} 项任务", { active: active.length, done }) : t("把想做的事拆成一个个小任务。");
  return `
    <section class="hero" aria-labelledby="hero-title">
      <a class="hero-body" href="#goals${next ? "/" + h(next.id) : ""}">
        <h1 id="hero-title">${h(headline)}</h1>
        <p>${h(caption)}</p>
      </a>
      <div class="hero-art" aria-hidden="true">
        <div class="orbit orbit-a"></div><div class="orbit orbit-b"></div>
        <div class="art-grid"></div><div class="art-light"></div>
        <div class="stair stair-one"></div><div class="stair stair-two"></div><div class="stair stair-three"></div>
        <span class="art-spark spark-one">✦</span><span class="art-spark spark-two">✦</span>
        <span class="art-dot"></span><span class="art-check">${icon("check", 29)}</span>
      </div>
    </section>
    <div class="dashboard-grid">
      <section class="card goals-card">
        ${sectionHead("goals", "进行中的目标", link("goals", "全部目标"))}
        ${active.length ? `<div class="goal-rows">${active.map(goalRow).join("")}</div>` :
          empty("goals", data.goals.length ? "暂无进行中的目标" : "还没有目标", "", data.goals.length ? link("goals", "目标管理") : action("新建目标", "edit-goal", "", "plus", "quiet"))}
      </section>
      <section class="card finance-card">
        ${sectionHead("finance", "本月财务", link("finance", "财务概览"))}
        ${totals.count ? financeStats(totals, true) : empty("finance", "本月暂无收支", "")}
        ${savingsCard()}
        ${action("记一笔", "edit-transaction", "", "plus", "quiet log-button")}
      </section>
      <section class="card notes-card">
        ${sectionHead("notes", "最近思考", `<div class="section-actions">${link("notes", "全部记录")}${action("新建记录", "edit-note", "", "plus", "quiet")}</div>`)}
        ${data.notes.length ? `<div class="note-grid">${updatedFirst(data.notes).slice(0, 3).map(noteCard).join("")}</div>` :
          empty("notes", "还没有思考记录", "随手记下一件值得回看的事。")}
      </section>
    </div>`;
}

function goalPage() {
  const goal = data.goals.find(record => record.id === route.id);
  if (route.id && !goal) return missing("goals", "这项目标已不存在");
  if (!goal) return `${pageHead(t("目标管理"), t("把目标拆成事项，再从一个任务开始。"), action("新建目标", "edit-goal", "", "plus", "primary"))}
    ${data.goals.length ? `<div class="collection-grid">${data.goals.map(goalTile).join("")}</div>` :
      `<section class="card">${empty("goals", "还没有目标", "", action("新建目标", "edit-goal", "", "plus", "primary"))}</section>`}`;
  const stat = goalProgress(goal);
  return `<a class="back-link" href="#goals">${icon("back", 17)} ${t("全部目标")}</a>
    ${pageHead(goal.title, goal.description, [
      action("发给 AI", "share-goal", goal.id, "spark", "quiet"), action("编辑", "edit-goal", goal.id, "edit"), mini("delete-goal", goal.id, "trash", "删除目标"),
    ].join(""))}
    <section class="card detail-progress ${goal.tone}">
      <span class="goal-icon">${icon(toneIcons[goal.tone], 22)}</span>
      <div class="detail-progress-body"><div><strong>${t("目标进度")}</strong><small>${taskCount(stat)}</small></div>
      ${stat.total ? bar(stat.percent, "目标进度") : ""}</div>${badge(stat)}
    </section>
    <div class="section-divider"><h2>${t("事项与任务")}</h2>${action("新建事项", "edit-item", "", "plus", "primary")}</div>
    <div class="item-list">${goal.items.length ? goal.items.map(itemCard).join("") :
      `<section class="card">${empty("notes", "还没有事项", "创建事项后就可以添加任务。")}</section>`}</div>`;
}

const badge = stat => `<span class="badge ${isComplete(stat) ? "complete" : ""}">${t(isComplete(stat) ? "已完成" : "进行中")}</span>`;

function goalTile(goal) {
  const stat = goalProgress(goal);
  return `<a class="card collection-tile ${goal.tone}" href="#goals/${h(goal.id)}">
    <div class="tile-head"><span class="goal-icon">${icon(toneIcons[goal.tone], 22)}</span>${badge(stat)}</div>
    <h2>${h(goal.title)}</h2>${goal.description ? `<p>${h(summary(goal.description))}</p>` : ""}
    <div class="tile-progress"><span>${taskCount(stat)}</span>${stat.total ? `<b>${stat.percent}%</b>` : ""}</div>
    ${stat.total ? bar(stat.percent, "目标进度") : ""}</a>`;
}

function itemCard(item) {
  const stat = progress(item.tasks);
  return `<section class="card item-card">
    <header><div><h3>${h(item.title)}</h3><small>${taskCount(stat)}${stat.total ? ` · ${stat.percent}%` : ""}</small></div><div class="row-actions">
    ${mini("edit-item", item.id, "edit", "编辑事项")}${mini("delete-item", item.id, "trash", "删除事项")}</div></header>
    ${stat.total ? bar(stat.percent, t("{title}的任务进度", item)) : ""}
    <div class="task-list">${item.tasks.map(task => `<div class="task-row">
      <label class="${task.done ? "done" : ""}"><input type="checkbox" data-task="${h(task.id)}" data-item="${h(item.id)}" ${task.done ? "checked" : ""}><span>${h(task.title)}</span></label>
      <div class="row-actions">${mini("edit-task", item.id + "/" + task.id, "edit", "编辑任务")}${mini("delete-task", item.id + "/" + task.id, "trash", "删除任务")}</div>
    </div>`).join("")}</div>
    ${action("添加任务", "edit-task", item.id, "plus", "quiet")}
  </section>`;
}

function notesPage() {
  const note = data.notes.find(record => record.id === route.id);
  if (route.id && !note) return missing("notes", "这条记录已不存在");
  if (note) return `<a class="back-link" href="#notes">${icon("back", 17)} ${t("全部记录")}</a>
    ${pageHead(note.title || summary(note.body, 46), t("更新于 {date}", { date: dateLabel(note.updatedAt) }), [
      action("发给 AI", "share-note", note.id, "spark", "quiet"), action("编辑", "edit-note", note.id, "edit"), mini("delete-note", note.id, "trash", "删除记录"),
    ].join(""))}
    <article class="card note-body">${h(note.body)}</article>`;
  return `${pageHead(t("思考记录"), t("记录一个想法，留给之后的自己。"), action("新建记录", "edit-note", "", "plus", "primary"))}
    ${data.notes.length ? `<div class="collection-grid notes-collection">${updatedFirst(data.notes).map(noteCard).join("")}</div>` :
      `<section class="card">${empty("notes", "还没有思考记录", "", action("新建记录", "edit-note", "", "plus", "primary"))}</section>`}`;
}

function financePage() {
  const totals = monthlyTotals(data.transactions, month);
  const records = data.transactions.filter(record => record.date.startsWith(month)).sort((a, b) => b.date.localeCompare(a.date));
  return `${pageHead(t("财务概览"), t("查看每月收支与当前存款进度。"), action("记一笔", "edit-transaction", "", "plus", "primary"))}
    <div class="finance-grid">
      <section class="card">${sectionHead("finance", "月度概况", `<label class="month-field"><span class="sr-only">${t("选择月份")}</span><input type="month" id="month" value="${h(month)}"></label>`)}
      ${financeStats(totals)}</section>
      <section class="card">${sectionHead("goals", "存款")}${savingsCard()}</section>
    </div>
    <section class="card ledger">${sectionHead("notes", "收支记录", `<span class="muted">${t("{count} 笔", { count: records.length })}</span>`)}
    ${records.length ? `<div class="ledger-list">${records.map(transactionRow).join("")}</div>` :
      empty("finance", "这个月暂无收支记录", "", action("记一笔", "edit-transaction", "", "plus", "quiet"))}</section>`;
}

function transactionRow(record) {
  const income = record.type === "income";
  const label = t(income ? "收入" : "支出");
  return `<div class="transaction-row">
    <span class="transaction-icon ${record.type}">${icon(income ? "downRight" : "upRight", 19)}</span>
    <div class="transaction-name"><strong>${h(record.note || label)}</strong><small>${dateLabel(record.date)} · ${label}</small></div>
    <b class="${record.type}">${income ? "+" : "−"}${money(record.cents)}</b>
    <div class="row-actions">${mini("edit-transaction", record.id, "edit", "编辑收支")}${mini("delete-transaction", record.id, "trash", "删除收支")}</div>
  </div>`;
}

const chatTitle = chat => summary(chat.messages.find(message => message.role === "user")?.text || t("新会话"), 34);

function chatHistory() {
  return `${pageHead(t("AI 对话历史"), t("打开一段对话，接着聊。"), action("新建会话", "new-chat", "", "plus", "primary"))}
    <section class="card history-card">
    ${data.chats.length ? updatedFirst(data.chats).map(chat => `<div class="history-row">
      <button class="history-entry" type="button" data-action="open-chat" data-id="${h(chat.id)}">
      <span class="section-icon">${icon("chats", 20)}</span><span><strong>${h(chatTitle(chat))}</strong><small><time datetime="${h(chat.updatedAt)}">${activityLabel(chat.updatedAt)}</time> · ${t("{count} 条消息", { count: chat.messages.length })}</small></span>${icon("chevron", 17)}</button>
      ${mini("delete-chat", chat.id, "trash", "删除会话")}</div>`).join("") :
      empty("chats", "还没有对话", "", action("新建会话", "new-chat", "", "plus", "primary"))}
    </section>`;
}

function missing(page, message) {
  return `<section class="card">${empty(page, message, "", link(page, t("返回{page}", { page: t(labels[page]) })))}</section>`;
}

const textField = (label, name, value, { required = false, long = false, max = 120 } = {}) =>
  `<label class="field"><span>${t(label)}${required ? "" : ` <small>${t("选填")}</small>`}</span>${
    long ? `<textarea name="${name}" rows="5" maxlength="${max}" ${required ? "required" : ""}>${h(value)}</textarea>` :
      `<input name="${name}" value="${h(value)}" maxlength="${max}" ${required ? "required" : ""}>`
  }</label>`;

const numberField = (label, name, cents, min, required) => `<label class="field"><span>${t(label)}</span><input
  type="number" name="${name}" value="${cents == null ? "" : (cents / 100).toFixed(2)}" min="${min}" max="999999999.99" step="0.01" inputmode="decimal" ${required ? "required" : ""}></label>`;

function openDialog(title, fields, submit, { danger = false, label = "保存" } = {}) {
  dialogSubmit = submit;
  dialog.innerHTML = `<form id="edit-form">
    <header class="dialog-head"><h2 id="dialog-title">${t(title)}</h2>${mini("close-dialog", "", "close", "关闭弹窗")}</header>
    <div class="dialog-fields">${fields}<p class="form-error" role="alert" hidden></p></div>
    <footer>${action("取消", "close-dialog")}<button type="submit" class="button ${danger ? "danger" : "primary"}">${t(label)}</button></footer>
  </form>`;
  dialog.showModal();
  const initial = dialog.querySelector(".dialog-fields input, .dialog-fields textarea, .dialog-fields select") ||
    dialog.querySelector("footer [data-action=close-dialog]");
  initial.focus();
}

function save(change, after = renderMain) {
  if (!commit(change)) return "保存失败，请重试。";
  after();
  return "";
}

function formError(message) {
  const error = dialog.querySelector(".form-error");
  error.textContent = t(message);
  error.hidden = !message;
}

const titleRequired = fields => fields.get("title").trim();
const centsFrom = value => value === "" ? null : Math.round(Number(value) * 100);
const goalBy = (state, id = route.id) => state.goals.find(goal => goal.id === id);
const itemBy = (state, id) => goalBy(state).items.find(item => item.id === id);

function editGoal(id) {
  const goal = goalBy(data, id);
  openDialog(goal ? "编辑目标" : "新建目标",
    textField("目标名称", "title", goal?.title, { required: true }) +
    textField("说明", "description", goal?.description, { long: true, max: 1000 }),
    fields => {
      const title = titleRequired(fields);
      if (!title) return "请输入目标名称。";
      const description = fields.get("description").trim();
      const recordId = goal?.id || uid();
      return save(next => {
        if (goal) Object.assign(goalBy(next, recordId), { title, description });
        else next.goals.push({ id: recordId, title, description, tone: goalTones[next.goals.length % goalTones.length], items: [] });
      }, () => goal ? renderMain() : navigate("goals", recordId));
    });
}

function editItem(id) {
  const item = itemBy(data, id);
  openDialog(item ? "编辑事项" : "新建事项", textField("事项名称", "title", item?.title, { required: true }), fields => {
    const title = titleRequired(fields);
    if (!title) return "请输入事项名称。";
    return save(next => {
      if (item) itemBy(next, id).title = title;
      else goalBy(next).items.push({ id: uid(), title, tasks: [] });
    });
  });
}

function editTask(key) {
  const [itemId, taskId] = key.split("/");
  const task = itemBy(data, itemId).tasks.find(record => record.id === taskId);
  openDialog(task ? "编辑任务" : "添加任务", textField("任务名称", "title", task?.title, { required: true }), fields => {
    const title = titleRequired(fields);
    if (!title) return "请输入任务名称。";
    return save(next => {
      const tasks = itemBy(next, itemId).tasks;
      if (task) tasks.find(record => record.id === taskId).title = title;
      else tasks.push({ id: uid(), title, done: false });
    });
  });
}

function editNote(id) {
  const note = data.notes.find(record => record.id === id);
  openDialog(note ? "编辑记录" : "新建记录",
    textField("标题", "title", note?.title) + textField("正文", "body", note?.body, { required: true, long: true, max: 10000 }),
    fields => {
      const title = fields.get("title").trim();
      const body = fields.get("body").trim();
      if (!body) return "请输入记录正文。";
      const record = { id: note?.id || uid(), title, body, updatedAt: new Date().toISOString() };
      return save(next => {
        if (note) Object.assign(next.notes.find(entry => entry.id === id), record);
        else next.notes.push(record);
      });
    });
}

function editTransaction(id) {
  const record = data.transactions.find(entry => entry.id === id);
  const typeField = `<fieldset class="type-field"><legend>${t("类型")}</legend><div>${[
    ["expense", "支出"], ["income", "收入"],
  ].map(([value, label]) => `<label><input type="radio" name="type" value="${value}" ${(record?.type || "expense") === value ? "checked" : ""}><span>${t(label)}</span></label>`).join("")}</div></fieldset>`;
  openDialog(record ? "编辑收支" : "记一笔", typeField + numberField("金额（人民币）", "amount", record?.cents, 0.01, true) +
    `<label class="field"><span>${t("日期")}</span><input type="date" name="date" value="${h(record?.date || localDate())}" required></label>` +
    textField("备注", "note", record?.note),
  fields => {
    const updated = { id: record?.id || uid(), type: fields.get("type"), cents: centsFrom(fields.get("amount")), date: fields.get("date"), note: fields.get("note").trim() };
    if (!updated.cents || updated.cents < 0) return "金额必须大于 0。";
    return save(next => {
      if (record) Object.assign(next.transactions.find(entry => entry.id === id), updated);
      else next.transactions.push(updated);
    }, () => {
      if (route.page === "finance") month = updated.date.slice(0, 7);
      renderMain();
    });
  });
}

function editSavings() {
  openDialog("编辑存款",
    `<p class="field-hint">${t("存款手动更新，月度收支独立统计。")}</p>` +
    numberField("当前存款（人民币）", "current", data.savings.current, 0, false) +
    numberField("存款目标（人民币）", "target", data.savings.target, 0.01, false),
  fields => save(next => {
    next.savings = { current: centsFrom(fields.get("current")), target: centsFrom(fields.get("target")) };
  }));
}

function confirmDelete(kind, id) {
  const [itemId, taskId] = id.split("/");
  const goal = kind === "goal" ? goalBy(data, id) : null;
  const item = kind === "item" || kind === "task" ? itemBy(data, itemId) : null;
  const objects = {
    goal: "目标", item: "事项", task: "任务", note: "思考记录", transaction: "收支记录", chat: "会话",
  };
  const unit = { goal: "个", item: "个", task: "项", note: "条", transaction: "笔", chat: "段" }[kind];
  const name = t(objects[kind], {}, { "思考记录": "note", "收支记录": "transaction" });
  let detail = t("确定删除这{unit}{name}？", { unit, name });
  if (goal?.items.length) detail = t("删除「{title}」将一并删除 {items} 个事项和 {tasks} 项任务。", { title: goal.title, items: goal.items.length, tasks: goalProgress(goal).total });
  if (kind === "item" && item.tasks.length) detail = t("删除「{title}」将一并删除 {tasks} 项任务。", { title: item.title, tasks: item.tasks.length });
  openDialog(t("删除{name}", { name }), `<p class="delete-copy">${h(detail)}</p>`, () => save(next => {
    const lists = { goal: "goals", note: "notes", transaction: "transactions", chat: "chats" };
    if (lists[kind]) {
      const key = lists[kind];
      next[key] = next[key].filter(record => record.id !== id);
    } else if (kind === "item") {
      const current = goalBy(next);
      current.items = current.items.filter(record => record.id !== itemId);
    } else {
      const parent = itemBy(next, itemId);
      parent.tasks = parent.tasks.filter(record => record.id !== taskId);
    }
  }, () => {
    if (kind === "chat") {
      drafts.delete(id);
      if (activeChat === id) activeChat = null;
      renderAI();
    }
    if (kind === "goal") navigate("goals");
    else if (kind === "note") navigate("notes");
    else renderMain();
  }), { danger: true, label: "确认删除" });
}

const mobile = matchMedia("(max-width: 760px)");

function syncPanelMode() {
  const modal = aiOpen && mobile.matches;
  $(".workspace").inert = modal;
  document.body.classList.toggle("chat-fullscreen", modal);
  panel.setAttribute("role", modal ? "dialog" : "complementary");
  panel.setAttribute("aria-modal", String(modal));
}

function setAIOpen(open) {
  if (open && !aiOpen) {
    const trigger = document.activeElement;
    aiReturnFocus = trigger?.matches("[data-action=toggle-ai]") ? null : trigger;
  }
  aiOpen = open;
  menuOpen = false;
  renderNavigation();
  renderAI();
  if (open) $("#chat-input").focus();
  else (aiReturnFocus?.isConnected ? aiReturnFocus : $("#topbar [data-action=toggle-ai]")).focus();
}

function renderAI({ scroll = true } = {}) {
  panel.hidden = !aiOpen;
  syncPanelMode();
  if (!aiOpen) return;
  panel.setAttribute("aria-label", t("AI 助手"));
  const chat = data.chats.find(entry => entry.id === activeChat);
  const sending = pending.get(activeChat);
  const focused = document.activeElement?.id === "chat-input";
  const selection = focused ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  const previousScroll = panel.querySelector(".message-list")?.scrollTop;
  panel.innerHTML = `<header class="ai-head"><span class="section-icon">${icon("spark", 21)}</span><div><strong>${t("AI 助手")}</strong><small>${settings.provider === "demo" ? t("模拟回复") : h(settings.model)}</small></div>
    ${mini("new-chat", "", "plus", "新建会话")}${mini("toggle-ai", "", "close", "关闭 AI 助手")}</header>
    ${chat ? `<div class="conversation-title">${h(chatTitle(chat))}</div>` : ""}
    <div class="message-list" aria-label="${t("会话消息")}">
      ${chat ? chat.messages.map(message => chatMessage(message, sending)).join("") :
      `<div class="chat-welcome"><span class="empty-icon">${icon("spark", 28)}</span><h2>${t("今天想聊什么？")}</h2>
      <p>${t("聊聊目标的下一步，或整理一个刚记下的想法。")}</p>
      ${action("帮我拆解一个目标", "chat-prompt", t("帮我把一个目标拆成更容易开始的任务。"), "goals", "quiet")}
      ${action("和我做一次周复盘", "chat-prompt", t("带我做一次十分钟的周复盘。"), "notes", "quiet")}</div>`}
      ${sending ? `<p class="sending" role="status">${t("AI 正在回复…")}</p>` : ""}
    </div>
    <form class="composer" id="chat-form">
      <div class="composer-field"><textarea id="chat-input" rows="2" maxlength="12000" aria-label="${t("输入消息")}" placeholder="${t("输入消息…")}">${h(drafts.get(activeChat) || "")}</textarea>
      <button type="submit" class="button primary send-button" aria-label="${t("发送消息")}" title="${t("发送消息")}" ${sending ? "disabled" : ""}>${icon("send", 18)}</button></div>
      <small>${t("Enter 发送 · Shift + Enter 换行")}</small>
    </form>`;
  if (focused) {
    $("#chat-input").focus({ preventScroll: true });
    $("#chat-input").setSelectionRange(...selection);
  }
  const list = panel.querySelector(".message-list");
  list.scrollTop = scroll ? list.scrollHeight : previousScroll || 0;
}

function chatMessage(message, sending) {
  return `<article class="message ${message.role}">
    ${message.role === "assistant" ? `<span class="message-avatar">${icon("spark", 16)}</span>` : ""}
    <div class="message-content"><div class="bubble">${h(message.text)}</div>
    ${message.status === "failed" && sending !== message.id ? `<div class="message-error">${t("发送失败")} ${sending ? "" : action("重试", "retry-message", message.id, "", "quiet")}</div>` : ""}</div>
  </article>`;
}

function openChat(id) {
  activeChat = id;
  setAIOpen(true);
}

function draftMessage(text) {
  const before = drafts.get(activeChat);
  const draft = (before ? before + "\n\n" : "") + text;
  setAIOpen(true);
  if (draft.length > 12000) return notify("内容超过 12,000 字，请缩短草稿后再试。");
  drafts.set(activeChat, draft);
  const input = $("#chat-input");
  input.value = draft;
  input.setSelectionRange(input.value.length, input.value.length);
}

function shareGoal(id) {
  const goal = goalBy(data, id);
  const lines = goal.items.map(item => {
    const stat = progress(item.tasks);
    const tasks = item.tasks.map(task => `  - ${t(task.done ? "已完成" : "待完成")} · ${task.title}`);
    return [`- ${item.title}（${stat.done}/${stat.total}）`, ...tasks].join("\n");
  });
  draftMessage([t("我想聊聊目标「{title}」。", goal), goal.description, ...lines].filter(Boolean).join("\n"));
}

function shareNote(id) {
  const note = data.notes.find(record => record.id === id);
  const title = !note.title ? "" : document.documentElement.lang === "en" ? ` “${note.title}”` : `「${note.title}」`;
  draftMessage(`${t("我想聊聊这条思考记录{title}。", { title })}\n\n${note.body}`);
}

function mockReply(chat, message) {
  const previous = chat.messages.filter(entry => entry.role === "user" && entry.id !== message.id && entry.status !== "failed");
  if (document.documentElement.lang === "en") {
    const focus = previous.length ? `Building on “${summary(previous.at(-1).text, 24)}”, try this:\n\n` : "";
    if (/review|复盘/i.test(message.text)) return focus + "Write down one win from this week, one obstacle, and one step you can take in ten minutes next week.\n\nWhich moment would you like to start with?";
    if (/note|思考记录/i.test(message.text)) return focus + "Pick one idea from your note and turn it into a small experiment you can try this week.\n\nWhat would help you tell if it worked?";
    return focus + `You mentioned “${summary(message.text, 36)}”. Pick a step you can start in ten minutes and decide what done would look like.\n\nWhat feels easiest to start today?`;
  }
  const focus = previous.length ? `接着你前面提到的「${summary(previous.at(-1).text, 24)}」，` : "";
  if (/复盘/.test(message.text)) return `${focus}可以试试三步：先写下本周做成的一件事，再找出一处卡点，最后给下周定一个十分钟内能开始的小动作。\n\n你这周最想回顾的是哪件事？`;
  if (/思考记录/.test(message.text)) return `${focus}可以先从这条记录里找一句最想验证的话，再把它改成一个本周能尝试的小实验。\n\n你想保留这条想法，还是试着把它变成行动？`;
  if (/目标|任务|英语/.test(message.text)) {
    const next = message.text.match(/待完成 · ([^\n]+)/)?.[1];
    return `${focus}${next ? "可以先从「" + next + "」开始。" : "挑一个十分钟内就能着手的小任务。"}给它写一个明确的完成标准，然后安排在一个固定时间做一次。\n\n哪一步现在最容易开始？`;
  }
  return `${focus}我注意到你提到「${summary(message.text, 28)}」。可以先写下你希望发生的变化，再选一个今天就能尝试的动作。\n\n你更想先理清思路，还是一起定一个行动？`;
}

function sendMessage() {
  const text = (drafts.get(activeChat) || "").trim();
  if (!text || pending.has(activeChat)) return;
  const oldChat = activeChat;
  const chatId = oldChat || uid();
  const messageId = uid();
  const saved = commit(next => {
    let chat = next.chats.find(entry => entry.id === chatId);
    if (!chat) {
      chat = { id: chatId, updatedAt: "", messages: [] };
      next.chats.push(chat);
    }
    chat.messages.push({ id: messageId, role: "user", text, status: "failed" });
    chat.updatedAt = new Date().toISOString();
  });
  if (!saved) return notify("保存失败，请重试。");
  drafts.delete(oldChat);
  activeChat = chatId;
  requestReply(chatId, messageId, text === "/失败");
}

async function modelReply(config, messages) {
  const response = await fetch(config.baseUrl.replace(/\/chat\/completions$/, "") + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${config.apiKey}` },
    body: JSON.stringify({ model: config.model, messages, stream: false }),
    redirect: "error",
    signal: AbortSignal.timeout(90000),
  });
  if (!response.ok) throw new Error(t("接口返回 HTTP {status}，请检查 AI 设置后重试。", { status: response.status }));
  const result = await response.json().catch(() => null);
  const reply = result?.choices?.[0]?.message?.content;
  if (typeof reply !== "string" || !reply.trim()) throw new Error(t("模型未返回文本，请重试。"));
  return reply.trim();
}

async function requestReply(chatId, messageId, simulateFailure = false) {
  if (pending.has(chatId)) return;
  const chat = data.chats.find(entry => entry.id === chatId);
  const index = chat?.messages.findIndex(entry => entry.id === messageId);
  if (!chat || index < 0) return;
  const context = { messages: chat.messages.slice(0, index + 1) };
  const message = context.messages.at(-1);
  const config = settings;
  pending.set(chatId, messageId);
  if (route.page === "chats") renderMain();
  renderAI();
  try {
    let reply;
    if (config.provider === "demo") {
      await new Promise(resolve => setTimeout(resolve, 550));
      if (simulateFailure) return;
      reply = mockReply(context, message);
    } else {
      const messages = context.messages.filter(entry => entry.status !== "failed" || entry.id === messageId)
        .map(({ role, text }) => ({ role, content: text }));
      reply = await modelReply(config, messages);
    }
    if (data.chats.some(entry => entry.id === chatId)) {
      const saved = commit(next => {
        const current = next.chats.find(entry => entry.id === chatId);
        const at = current.messages.findIndex(entry => entry.id === messageId);
        delete current.messages[at].status;
        current.messages.splice(at + 1, 0, { id: uid(), role: "assistant", text: reply });
        current.updatedAt = new Date().toISOString();
      });
      if (!saved) notify("回复保存失败，可以重试。");
    }
  } catch (error) {
    if (activeChat === chatId && aiOpen) {
      notify(error instanceof TypeError || error.name === "TimeoutError"
        ? "无法连接模型服务，请检查接口地址和网络后重试。" : error.message);
    }
  } finally {
    pending.delete(chatId);
    if (route.page === "chats") renderMain();
    if (activeChat === chatId) renderAI();
  }
}

const actions = {
  "toggle-menu": () => {
    menuOpen = !menuOpen;
    renderNavigation();
    $("#topbar [data-action=toggle-menu]").focus();
  },
  "toggle-ai": () => setAIOpen(!aiOpen),
  "locate-weather": () => refreshWeather(true),
  "close-dialog": () => dialog.close(),
  "edit-goal": editGoal, "edit-item": editItem, "edit-task": editTask,
  "edit-note": editNote, "edit-transaction": editTransaction, "edit-savings": editSavings,
  "delete-goal": id => confirmDelete("goal", id),
  "delete-item": id => confirmDelete("item", id),
  "delete-task": id => confirmDelete("task", id),
  "delete-note": id => confirmDelete("note", id),
  "delete-transaction": id => confirmDelete("transaction", id),
  "delete-chat": id => confirmDelete("chat", id),
  "share-goal": shareGoal, "share-note": shareNote,
  "open-chat": openChat, "new-chat": () => { drafts.delete(null); openChat(null); },
  "chat-prompt": draftMessage,
  "retry-message": id => requestReply(activeChat, id),
};

document.addEventListener("click", event => {
  const button = event.target.closest("[data-action]");
  if (button) actions[button.dataset.action]?.(button.dataset.id);
  const menuLink = event.target.closest(".mobile-menu a");
  if (menuLink && menuLink.hash === location.hash) navigate(route.page);
});

document.addEventListener("input", event => {
  if (event.target.id === "chat-input") drafts.set(activeChat, event.target.value);
  if (event.target.closest("#edit-form")) formError("");
  const error = event.target.closest("#model-form")?.querySelector(".form-error");
  if (error) error.hidden = true;
});

document.addEventListener("change", event => {
  const input = event.target;
  if (input.matches(".theme-picker input")) {
    if (saveSettings({ theme: input.value })) applyTheme();
    else {
      document.querySelector(`.theme-picker input[value="${settings.theme}"]`).checked = true;
      notify("保存失败，请重试。");
    }
  }
  if (input.id === "language") {
    const modelDraft = new FormData($("#model-form"));
    if (saveSettings({ language: input.value })) {
      toast.hidden = true;
      render();
      const form = $("#model-form");
      form.elements.provider.value = modelDraft.get("provider");
      syncProvider(form);
      for (const name of ["baseUrl", "model", "apiKey"]) {
        if (modelDraft.has(name)) form.elements[name].value = modelDraft.get(name);
      }
      $("#language").focus();
    } else {
      input.value = settings.language;
      notify("保存失败，请重试。");
    }
  }
  if (input.matches('#model-form [name="provider"]')) syncProvider(input.form);
  if (input.id === "month" && input.value) {
    month = input.value;
    renderMain();
    $("#month").focus();
  }
  if (input.matches("[data-task]")) {
    const { item, task } = input.dataset;
    if (commit(next => { itemBy(next, item).tasks.find(entry => entry.id === task).done = input.checked; })) {
      renderMain();
      main.querySelector(`[data-task="${CSS.escape(task)}"]`).focus();
    } else {
      input.checked = !input.checked;
      notify("保存失败，请重试。");
    }
  }
});

document.addEventListener("submit", event => {
  if (event.target.id === "edit-form") {
    event.preventDefault();
    const result = dialogSubmit(new FormData(event.target));
    if (result) formError(result);
    else {
      dialog.close();
      notify("已保存");
    }
  }
  if (event.target.id === "chat-form") {
    event.preventDefault();
    sendMessage();
  }
  if (event.target.id === "model-form") {
    event.preventDefault();
    saveModel(event.target);
  }
});

document.addEventListener("keydown", event => {
  if (event.target.id === "chat-input" && event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    sendMessage();
  }
  if (event.key === "Escape" && !dialog.open) {
    if (aiOpen) setAIOpen(false);
    else if (menuOpen) actions["toggle-menu"]();
  }
});

mobile.addEventListener("change", syncPanelMode);
systemTheme.addEventListener("change", applyTheme);
render();
setInterval(updateClock, 1000);
setInterval(() => { if (weatherCoordinates) refreshWeather(); }, 15 * 60 * 1000);
navigator.permissions?.query({ name: "geolocation" }).then(permission => {
  if (permission.state === "granted") refreshWeather();
}).catch(() => {});
  </script>
</body>
