<!doctype html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6fc">
    <meta name="description" content="管理目标、记录思考、查看收支与存款。">
    <meta name="format-detection" content="telephone=no">

    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest">
    <link rel="icon" href="%sveltekit.assets%/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png">

    <!-- iOS 从主屏启动时不走浏览器外壳，这两条决定它当成独立应用打开 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="步序">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
