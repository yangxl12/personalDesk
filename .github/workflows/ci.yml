name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright==1.61.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e/workspace.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository
        run: |
          scanner_dir=$(mktemp -d)
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.28.0
          archive=gitleaks_8.28.0_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$release/$archive" --output "$scanner_dir/$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_8.28.0_checksums.txt" --output "$scanner_dir/checksums.txt"
          (cd "$scanner_dir" && awk -v file="$archive" '$2 == file {print}' checksums.txt | sha256sum --check && tar -xzf "$archive" gitleaks)
          "$scanner_dir/gitleaks" dir . --redact --no-banner
