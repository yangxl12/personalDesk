services:
  app:
    build:
      context: ..
    environment:
      ORIGIN: https://${BUXU_DOMAIN:?Set BUXU_DOMAIN}
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 1
      BODY_SIZE_LIMIT: 8M
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY_FILE: ${AI_API_KEY_FILE:-}
      AI_CONFIG_KEY_FILE: ${AI_CONFIG_KEY_FILE:-}
      AI_DAILY_REQUESTS: ${AI_DAILY_REQUESTS:-30}
    volumes:
      - workspace:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 7s
      retries: 3
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      BUXU_DOMAIN: ${BUXU_DOMAIN:?Set BUXU_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  workspace:
  caddy_data:
  caddy_config:
